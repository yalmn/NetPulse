<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetPulse Monitoring</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
      </svg>
      NetPulse
    </div>
    <span class="meta" id="conn-status"></span>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h2>Monitoring Dashboard</h2>
        <p>Healthchecks fuer HTTP, HTTPS und Ping via Globalping, plus Erreichbarkeit aus mehreren Laendern.</p>
      </div>
      <div class="toolbar">
        <button class="btn btn-ghost" id="pause-btn">Pause</button>
      </div>
    </div>

    <!-- Einrichtung -->
    <div class="card">
      <div class="card-body">
        <div class="dash-setup">
          <div class="form-field target-field">
            <label for="target-input">Ziel hinzufuegen (IP oder URL)</label>
            <div class="input-row">
              <input id="target-input" type="text" placeholder="z. B. example.com oder 1.1.1.1" autocomplete="off" />
              <button class="btn btn-primary" id="add-target">Hinzufuegen</button>
            </div>
          </div>
          <div class="form-field interval-field">
            <label for="interval-input">Intervall (Sekunden)</label>
            <input id="interval-input" type="number" min="30" step="10" value="60" />
          </div>
        </div>
        <p class="hint" id="rate-estimate"></p>
      </div>
    </div>

    <!-- Zusammenfassung -->
    <div class="summary-bar" id="summary"></div>

    <!-- Ziele -->
    <div id="targets-grid"></div>

    <!-- Widget: Laender-Erreichbarkeit -->
    <div class="card">
      <div class="card-header-bar">
        <h3>Erreichbarkeit aus anderen Laendern</h3>
        <span class="meta" id="country-updated"></span>
      </div>
      <div class="card-body">
        <div id="country-widget"><div class="empty-state">Wird geladen, sobald Ziele vorhanden sind.</div></div>
      </div>
    </div>

    <footer>
      Alle Checks via <a href="https://globalping.io" target="_blank" rel="noopener">Globalping</a>. Laeuft direkt im Browser, solange dieser Tab geoeffnet ist.
    </footer>
  </main>

  <script src="chart.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
