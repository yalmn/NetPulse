<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetPulse – Daueraufnahme</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
      </svg>
      NetPulse
    </div>
    <a class="meta" href="index.html">← Übersicht</a>
  </header>

  <main class="container">
    <!-- Einrichtung -->
    <section id="setup">
      <div class="page-header">
        <div>
          <h2>Daueraufnahme</h2>
          <p>IP-Adressen / URLs eingeben und fortlaufend Ping, HTTP, HTTPS und Erreichbarkeit aufzeichnen – bis gestoppt.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="form-field" style="margin-bottom:14px;">
            <label for="targets-input">IP-Adressen / URLs (eine pro Zeile)</label>
            <textarea id="targets-input" rows="4" placeholder="example.com&#10;1.1.1.1&#10;github.com"></textarea>
          </div>

          <div class="country-picker" id="country-picker"></div>

          <div class="setup-row">
            <div class="form-field type-field">
              <label for="interval-input">Intervall (Minuten)</label>
              <input id="interval-input" type="number" min="1" step="1" value="5" />
            </div>
            <div class="type-toggles" id="type-toggles">
              <span class="picker-label">Messungen:</span>
              <label class="chip"><input type="checkbox" value="ping" checked /> Ping</label>
              <label class="chip"><input type="checkbox" value="http" checked /> HTTP</label>
              <label class="chip"><input type="checkbox" value="https" checked /> HTTPS</label>
            </div>
          </div>

          <p class="hint" id="rate-estimate"></p>

          <div style="margin-top:14px;">
            <button class="btn btn-primary" id="start-btn">Aufnahme starten</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Laufende Aufnahme -->
    <section id="recording" style="display:none;">
      <div class="page-header">
        <div>
          <h2>Daueraufnahme läuft</h2>
          <p id="rec-subtitle"></p>
        </div>
        <div class="toolbar">
          <button class="btn btn-danger-solid" id="stop-btn">Stoppen</button>
          <button class="btn btn-ghost" id="reset-btn">Neu</button>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="session-stats" id="session-stats"></div>
        </div>
      </div>

      <div id="rec-content"></div>
    </section>

    <footer>
      Messungen via <a href="https://globalping.io" target="_blank" rel="noopener">Globalping</a>. Läuft im Browser, solange dieser Tab geöffnet und wach ist.
    </footer>
  </main>

  <script src="chart.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
